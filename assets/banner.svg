<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Camilo Jaime. Three years answering the calls. Now I build what prevents them.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#12343b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#dots)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="62" width="64" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="104" font-size="19" font-weight="700" fill="#5eead4" letter-spacing="3">CAMILO JAIME</text>
    <text x="72" y="160" font-size="41" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Three years answering the calls.</text>
    <text x="72" y="212" font-size="41" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Now I build what <tspan fill="#fbbf24">prevents them.</tspan></text>
    <text x="72" y="268" font-size="21" fill="#cbd5e1">Support assistants and Python automation · English y español</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <rect x="846" y="56" width="366" height="228" rx="12" fill="#0b1220" stroke="#334155"/>
    <circle cx="870" cy="78" r="5" fill="#f87171"/><circle cx="888" cy="78" r="5" fill="#fbbf24"/><circle cx="906" cy="78" r="5" fill="#34d399"/>
    <text x="868" y="120" fill="#94a3b8">customer:</text>
    <text x="868" y="144" fill="#f8fafc">Why was I charged twice?</text>
    <text x="868" y="182" fill="#5eead4">assistant:</text>
    <text x="868" y="206" fill="#f8fafc">I can't see that from here,</text>
    <text x="868" y="230" fill="#f8fafc">and I won't guess.</text>
    <text x="868" y="262" fill="#fbbf24">→ connecting you to a person</text>
  </g>
</svg>
